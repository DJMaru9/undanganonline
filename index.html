<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Undangan Pernikahan — Zham &amp; Risda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   "OLYMPUS DI ATAS AWAN × BUDAYA MAKASSAR"
   Satu adegan ilustrasi hidup — kamera diarahkan otomatis,
   tamu cukup KETUK untuk lanjut (ketuk tepi kiri = kembali).
   Semua objek bergerak: matahari, awan, AIR TERJUN, burung,
   kain, kapal pinisi, kelopak, dan kedua mempelai.
   ============================================================ */
:root{
  --gading:#f4efe4;
  --gading-muda:#faf7ee;
  --emas:#b8944d;
  --emas-tua:#96762f;
  --emas-muda:#dcc48c;
  --marmer:#cfd6dd;
  --biru-pucat:#dfe6ec;
  --sage:#9aa88f;
  --teks:#5a5142;
  --gelap:#3d3627;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Jost',sans-serif;background:#e9e2d2;color:var(--teks);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
.bingkai{
  max-width:480px;height:100dvh;margin:0 auto;position:relative;
  overflow:hidden;box-shadow:0 0 60px rgba(90,75,40,.5);background:var(--biru-pucat);
}

#jendela{position:absolute;inset:0;overflow:hidden;cursor:pointer}
#adegan{
  position:absolute;top:0;left:0;width:1000px;height:1600px;
  transform-origin:0 0;will-change:transform;
}
#adegan svg{display:block;width:100%;height:100%}
#kanvasPartikel{position:absolute;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}

/* ============================================================
   🎬 ANIMASI ELEMEN ADEGAN (SVG digerakkan CSS)
   ============================================================ */
#adegan svg *{transform-box:fill-box}

/* matahari: sinar berputar + cahaya bernafas */
.sinar{transform-origin:center;animation:sinarPutar 60s linear infinite}
@keyframes sinarPutar{to{transform:rotate(360deg)}}
.cahaya{transform-origin:center;animation:cahayaNafas 5s ease-in-out infinite}
@keyframes cahayaNafas{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}

/* awan melayang pelan (tiga irama berbeda) */
.awan-a{animation:awanGeser 26s ease-in-out infinite alternate}
.awan-b{animation:awanGeser 34s ease-in-out infinite alternate-reverse}
.awan-c{animation:awanGeser 44s ease-in-out infinite alternate}
@keyframes awanGeser{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.awan-naik{animation:awanNaik 12s ease-in-out infinite}
@keyframes awanNaik{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* AIR TERJUN: aliran garis putih mengalir turun tanpa henti */
.aliran{stroke:#ffffff;stroke-linecap:round;fill:none;
  stroke-dasharray:34 46;animation:alirTurun 1.5s linear infinite}
.aliran.pelan{stroke-dasharray:22 58;animation-duration:2.3s}
.aliran.deras{stroke-dasharray:50 34;animation-duration:1.1s}
@keyframes alirTurun{to{stroke-dashoffset:-160}}
.busa{transform-origin:center;animation:busaDenyut 2.4s ease-in-out infinite}
.busa:nth-child(2){animation-delay:.6s}
.busa:nth-child(3){animation-delay:1.2s}
@keyframes busaDenyut{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.25);opacity:.45}}
.kabut{animation:kabutGeser 16s ease-in-out infinite alternate}
@keyframes kabutGeser{from{transform:translateX(-18px)}to{transform:translateX(18px)}}

/* burung terbang melintas */
.burung{animation:burungLintas 22s linear infinite}
.burung.b2{animation-duration:29s;animation-delay:6s}
.burung.b3{animation-duration:36s;animation-delay:13s}
@keyframes burungLintas{
  0%{transform:translate(-140px,30px)}
  50%{transform:translate(560px,-26px)}
  100%{transform:translate(1180px,12px)}
}
.sayap{transform-origin:center;animation:kepak .5s ease-in-out infinite alternate}
@keyframes kepak{from{transform:scaleY(1)}to{transform:scaleY(.35)}}

/* kain & tirai berkibar, rumbai berayun */
.kibar{transform-origin:top center;animation:kibaran 7s ease-in-out infinite}
.kibar.lambat{animation-duration:10s;animation-delay:2s}
@keyframes kibaran{0%,100%{transform:skewX(0) rotate(0)}50%{transform:skewX(-3deg) rotate(1.4deg)}}
.rumbai{transform-origin:top center;animation:ayun 3.4s ease-in-out infinite}
.rumbai.r2{animation-delay:1.1s}
@keyframes ayun{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

/* mempelai bernafas lembut, buket berkilau */
.nafas{animation:nafasHalus 4.5s ease-in-out infinite}
.nafas.n2{animation-delay:1.6s}
@keyframes nafasHalus{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.kerlip{transform-origin:center;animation:kerlipan 2.6s ease-in-out infinite}
.kerlip.k2{animation-delay:.9s}
.kerlip.k3{animation-delay:1.7s}
@keyframes kerlipan{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}

/* kapal pinisi berlayar di lautan awan */
.pinisi{animation:berlayar 40s ease-in-out infinite alternate}
@keyframes berlayar{from{transform:translateX(-60px) translateY(0)}
  50%{transform:translateX(140px) translateY(-8px)}
  to{transform:translateX(340px) translateY(0)}}

/* monogram & medali berputar aura */
.aura{transform-origin:center;animation:auraPutar 24s linear infinite}
@keyframes auraPutar{to{transform:rotate(360deg)}}

/* teks kartu utama berpendar cahaya */
.pendar{animation:pendarCahaya 3.5s ease-in-out infinite}
@keyframes pendarCahaya{0%,100%{opacity:.85}50%{opacity:1}}

/* ============================================================
   HUD (progres, keterangan, tombol)
   ============================================================ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:80}
#progres{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:5px;opacity:0;transition:.8s}
#progres.tampil{opacity:1}
#progres .ruas{flex:1;height:3.5px;border-radius:4px;background:rgba(90,75,40,.22);overflow:hidden}
#progres .ruas i{display:block;height:100%;width:0%;background:var(--emas);border-radius:4px;transition:width .5s ease}
#progres .ruas.lewat i{width:100%}
#progres .ruas.kini i{width:100%;transition:width 1.4s ease}

#keterangan{
  position:absolute;bottom:104px;left:50%;transform:translateX(-50%) translateY(16px);
  background:rgba(250,247,238,.94);backdrop-filter:blur(8px);color:var(--teks);
  border:1px solid rgba(184,148,77,.5);border-radius:18px;
  padding:12px 24px;text-align:center;max-width:86%;opacity:0;
  transition:opacity .6s, transform .6s;z-index:85;pointer-events:none;
  box-shadow:0 10px 30px rgba(90,75,40,.18);
}
#keterangan.tampil{opacity:1;transform:translateX(-50%) translateY(0)}
#keterangan .judul{font-family:'Great Vibes',cursive;font-size:1.5rem;color:var(--emas-tua);line-height:1.2}
#keterangan .isi{font-size:.72rem;letter-spacing:.06em;color:#8a7f63;margin-top:2px}

#ketukLanjut{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  color:var(--gading-muda);font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;
  background:rgba(150,118,47,.92);border:1px solid rgba(220,196,140,.7);
  border-radius:40px;padding:12px 26px;z-index:85;pointer-events:none;
  opacity:0;transition:.6s;display:flex;align-items:center;gap:10px;
}
#ketukLanjut.tampil{opacity:1;animation:denyutKecil 2.2s ease-in-out infinite}
@keyframes denyutKecil{0%,100%{box-shadow:0 0 0 0 rgba(184,148,77,.4)}50%{box-shadow:0 0 0 10px rgba(184,148,77,0)}}
#ketukLanjut .jari{font-size:1rem;animation:ketukan 1.6s ease-in-out infinite}
@keyframes ketukan{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px) scale(.92)}}

.riak{
  position:absolute;z-index:88;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--emas);pointer-events:none;animation:riakMuncul .7s ease-out forwards;
}
@keyframes riakMuncul{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(5)}}

#panelAkhir{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(30px);
  display:flex;gap:8px;z-index:90;opacity:0;pointer-events:none;transition:.7s;
  flex-wrap:wrap;justify-content:center;max-width:94%;
}
#panelAkhir.tampil{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#panelAkhir button,#panelAkhir a{
  border:1px solid rgba(184,148,77,.6);background:rgba(250,247,238,.95);
  backdrop-filter:blur(8px);color:var(--emas-tua);font-family:'Jost',sans-serif;
  font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
  padding:12px 18px;border-radius:40px;cursor:pointer;transition:.3s;
  display:flex;align-items:center;gap:7px;text-decoration:none;
  box-shadow:0 8px 22px rgba(90,75,40,.18);
}
#panelAkhir button:hover,#panelAkhir a:hover{background:var(--emas);color:#fff}

#btnMusik{
  position:absolute;top:28px;right:14px;z-index:90;width:42px;height:42px;
  border-radius:50%;border:1px solid rgba(184,148,77,.55);
  background:rgba(250,247,238,.92);color:var(--emas-tua);font-size:1rem;cursor:pointer;
  box-shadow:0 6px 18px rgba(90,75,40,.25);display:none;align-items:center;justify-content:center;
  pointer-events:auto;
}
#btnMusik.putar{animation:puter 4s linear infinite}
@keyframes puter{to{transform:rotate(360deg)}}

#chipMundur{
  position:absolute;top:28px;left:14px;z-index:85;
  background:rgba(250,247,238,.92);backdrop-filter:blur(6px);color:var(--teks);
  border:1px solid rgba(184,148,77,.5);border-radius:14px;padding:7px 13px;
  display:flex;gap:11px;font-family:'Cormorant Garamond',serif;
  opacity:0;transition:.8s;pointer-events:none;box-shadow:0 6px 18px rgba(90,75,40,.15);
}
#chipMundur.tampil{opacity:1}
#chipMundur b{color:var(--emas-tua);font-size:.95rem;font-weight:600}
#chipMundur span{font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;display:block;text-align:center;font-family:'Jost',sans-serif;color:#9a8f73}

/* ---------- SAMPUL ---------- */
#sampul{
  position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;color:var(--teks);
  padding:40px 28px;overflow:hidden;
}
#sampul .gerbang{
  position:absolute;top:0;bottom:0;width:51%;z-index:-1;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(220,196,140,.5), transparent 55%),
    linear-gradient(180deg,#efe9d8,#ddd3ba);
  transition:transform 1.6s cubic-bezier(.7,0,.3,1);
}
#sampul .gerbang.kiri{left:0;border-right:1px solid rgba(150,118,47,.25)}
#sampul .gerbang.kanan{right:0}
#sampul.terbuka .gerbang.kiri{transform:translateX(-101%)}
#sampul.terbuka .gerbang.kanan{transform:translateX(101%)}
#sampul.terbuka .isi-sampul{opacity:0;transform:scale(1.15);transition:.8s}
#sampul.selesai{visibility:hidden;pointer-events:none}
.isi-sampul{display:flex;flex-direction:column;align-items:center;transition:.8s}
.isi-sampul>*{opacity:0;animation:masukAtas 1s ease forwards}
.isi-sampul>*:nth-child(1){animation-delay:.2s}
.isi-sampul>*:nth-child(2){animation-delay:.45s}
.isi-sampul>*:nth-child(3){animation-delay:.7s}
.isi-sampul>*:nth-child(4){animation-delay:.95s}
.isi-sampul>*:nth-child(5){animation-delay:1.2s}
.isi-sampul>*:nth-child(6){animation-delay:1.45s}
@keyframes masukAtas{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#sampul .ornamen{font-size:1.3rem;color:var(--emas);letter-spacing:.5em;margin-bottom:1.2rem}
#sampul .ornamen span{display:inline-block;animation:goyang 3.5s ease-in-out infinite}
#sampul .ornamen span:nth-child(2){animation-delay:.5s}
#sampul .ornamen span:nth-child(3){animation-delay:1s}
@keyframes goyang{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(8deg)}}
#sampul .label{letter-spacing:.35em;text-transform:uppercase;font-size:.66rem;color:var(--emas-tua)}
#sampul .nama-script{
  font-family:'Great Vibes',cursive;font-size:2.9rem;margin:.4rem 0;line-height:1.25;
  background:linear-gradient(100deg,var(--emas-tua) 20%,#e9d9a8 40%,var(--emas-tua) 60%);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:kilau 4s linear infinite;
}
@keyframes kilau{to{background-position:-220% center}}
#sampul .tanggal{letter-spacing:.25em;font-size:.78rem;color:#9a8f73}
#sampul .kepada{margin-top:2.2rem;font-size:.78rem;color:#9a8f73;letter-spacing:.1em}
#sampul .nama-tamu{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:600;margin-top:.3rem;color:var(--gelap)}
#btnBuka{
  margin-top:1.7rem;border:1px solid var(--emas);background:transparent;color:var(--emas-tua);
  font-family:'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;
  padding:13px 34px;border-radius:40px;cursor:pointer;transition:.35s;opacity:0;
  animation:masukAtas 1s ease 1.7s forwards, denyutBuka 2.4s ease-in-out 3s infinite;
}
@keyframes denyutBuka{0%,100%{box-shadow:0 0 0 0 rgba(184,148,77,.4)}50%{box-shadow:0 0 0 12px rgba(184,148,77,0)}}
#btnBuka:hover{background:var(--emas);color:#fff}

/* ---------- LEMBAR ---------- */
.lembar{
  position:absolute;left:0;right:0;bottom:0;z-index:150;background:var(--gading-muda);
  border-radius:24px 24px 0 0;padding:22px 24px 30px;max-height:78%;overflow-y:auto;
  transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -14px 40px rgba(90,75,40,.3);text-align:center;touch-action:pan-y;
  user-select:text;-webkit-user-select:text;
}
.lembar.tampil{transform:translateY(0)}
.lembar .gagang{width:44px;height:4px;border-radius:4px;background:#d8cdb2;margin:0 auto 14px}
.lembar h3{font-family:'Great Vibes',cursive;font-weight:400;font-size:2rem;color:var(--emas)}
.lembar .tutup{
  position:absolute;top:14px;right:16px;border:none;background:#e9e1cc;color:var(--emas-tua);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.9rem;
}
.lembar label{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--emas-tua);display:block;margin:12px 0 5px;text-align:left}
.lembar input,.lembar textarea,.lembar select{
  width:100%;border:1px solid #ddd2b4;border-radius:12px;background:#fff;
  padding:12px 14px;font-family:'Jost',sans-serif;font-size:.9rem;color:var(--teks);
  transition:box-shadow .3s;
}
.lembar input:focus,.lembar textarea:focus,.lembar select:focus{outline:none;box-shadow:0 0 0 4px rgba(220,196,140,.35)}
.lembar textarea{min-height:80px;resize:vertical}
.tombol{
  display:inline-block;margin-top:16px;background:var(--emas);color:#fff;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;padding:13px 30px;
  border-radius:40px;border:none;cursor:pointer;font-family:'Jost',sans-serif;
  transition:.3s;position:relative;overflow:hidden;text-decoration:none;
}
.tombol::after{
  content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-20deg);animation:sapu 3.5s ease-in-out infinite;
}
@keyframes sapu{0%,60%{left:-80%}100%{left:160%}}
.tombol:hover{background:var(--emas-tua)}
.item-ucapan{background:#fff;border:1px solid #eae1c8;border-radius:14px;padding:13px 15px;margin-top:10px;text-align:left;animation:masukAtas .5s ease both}
.item-ucapan .siapa{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--gelap)}
.item-ucapan .tag{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--emas);margin-left:6px}
.item-ucapan .pesan{font-size:.83rem;color:#7a7059;margin-top:3px;line-height:1.55}
.kartu-rek{
  background:#fff;border:1px solid var(--emas-muda);border-radius:16px;padding:18px;margin-top:14px;
  position:relative;overflow:hidden;
}
.kartu-rek::before{
  content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(220,196,140,.3),transparent);
  transform:skewX(-20deg);animation:sapu 4.5s ease-in-out infinite;
}
.kartu-rek .bank{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--emas)}
.kartu-rek .norek{font-family:'Cormorant Garamond',serif;font-size:1.45rem;letter-spacing:.1em;margin:7px 0 2px;color:var(--gelap)}
.kartu-rek .pemilik{font-size:.78rem;color:#9a8f73}
.btn-salin{
  margin-top:10px;background:var(--emas);color:#fff;border:none;
  font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;padding:9px 20px;
  border-radius:30px;cursor:pointer;transition:.3s;font-family:'Jost',sans-serif;
}
.btn-salin:hover{background:var(--emas-tua)}
#tirai{position:absolute;inset:0;background:rgba(61,54,39,.4);z-index:140;opacity:0;pointer-events:none;transition:.5s}
#tirai.tampil{opacity:1;pointer-events:auto}

.hati{
  position:absolute;z-index:70;pointer-events:none;font-size:1.3rem;
  animation:hatiTerbang 1.8s ease-out forwards;
}
@keyframes hatiTerbang{
  from{opacity:1;transform:translateY(0) scale(.6) rotate(0)}
  to{opacity:0;transform:translateY(-120px) scale(1.4) rotate(20deg)}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important}
  .isi-sampul>*,#btnBuka{opacity:1 !important;transform:none !important}
  #kanvasPartikel{display:none}
}
</style>
</head>

<script>
/* ============================================================
   LOGIKA — tidak perlu diubah
   ============================================================ */
const C = CONFIG;
const kurangiGerak = matchMedia('(prefers-reduced-motion: reduce)').matches;
const namaPasangan = `${C.pria.lengkap} & ${C.wanita.lengkap}`;
const namaPendek = `${C.pria.panggilan} & ${C.wanita.panggilan}`;
const $ = id => document.getElementById(id);

/* ---------- isi teks ---------- */
$('s-nama').innerHTML = `${C.pria.lengkap}<br>&amp;<br>${C.wanita.lengkap}`;
$('s-tanggal').textContent = C.tanggalTeks;
document.title = `Undangan Pernikahan — ${namaPendek}`;
$('t-nama1').textContent = C.pria.lengkap;
$('t-nama2').textContent = C.wanita.lengkap;
$('t-tglKartu').textContent = C.tanggalTeks;
$('t-monogram').textContent = `${C.pria.inisial} | ${C.wanita.inisial}`;
$('t-saveTgl').textContent = C.tanggalSingkat;
function pisahOrtu(t){
  const i = t.indexOf('& ');
  return i>0 ? [t.slice(0,i).trim(), '& '+t.slice(i+2)] : [t,''];
}
$('t-priaP').textContent = C.pria.panggilan;
$('t-priaL').textContent = C.pria.lengkap;
{ const [a,b]=pisahOrtu(C.pria.ortu); $('t-priaO1').textContent=a; $('t-priaO2').textContent=b; }
$('t-wanitaP').textContent = C.wanita.panggilan;
$('t-wanitaL').textContent = C.wanita.lengkap;
{ const [a,b]=pisahOrtu(C.wanita.ortu); $('t-wanitaO1').textContent=a; $('t-wanitaO2').textContent=b; }
$('t-acaraJudul').textContent = C.acara.judul;
$('t-acaraHari').textContent = C.acara.hari;
$('t-acara1').textContent = C.acara.baris1;
$('t-acara2').textContent = C.acara.baris2;
$('t-lokNama').textContent = C.lokasi.nama;
$('t-lok1').textContent = C.lokasi.alamat[0]||'';
$('t-lok2').textContent = C.lokasi.alamat[1]||'';
$('t-arab').textContent = C.ayat.arab;
$('t-sumber').textContent = C.ayat.sumber;
C.ayat.arti.forEach((baris,i)=>{
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('y', -40 + i*22); t.textContent = baris;
  $('g-arti').appendChild(t);
});
$('btnMaps').href = C.mapsUrl;
const paramTamu = new URLSearchParams(location.search).get('to');
if(paramTamu) $('namaTamu').textContent = decodeURIComponent(paramTamu.replace(/\+/g,' '));

function acak(a,b){ return a+Math.random()*(b-a); }

/* ============================================================
   🎥 KAMERA (dikendalikan halaman — tamu tinggal ketuk)
   ============================================================ */
const jendela = $('jendela');
const adegan = $('adegan');
const LEBAR=1000, TINGGI=1600;
let cam = {x:500,y:800,s:1}, sMin=1;

function ukuran(){
  const r = jendela.getBoundingClientRect();
  sMin = Math.max(r.width/LEBAR, r.height/TINGGI);
  render();
}
function render(){
  cam.s = Math.max(cam.s, sMin);
  const r = jendela.getBoundingClientRect();
  const sx = r.width/(2*cam.s), sy = r.height/(2*cam.s);
  cam.x = Math.min(Math.max(cam.x, sx), LEBAR - sx);
  cam.y = Math.min(Math.max(cam.y, sy), TINGGI - sy);
  adegan.style.transform =
    `translate(${r.width/2}px,${r.height/2}px) scale(${cam.s}) translate(${-cam.x}px,${-cam.y}px)`;
}
addEventListener('resize', ukuran);

let animKamera=null;
function terbangKe(tx,ty,ts,durasi=2300){
  return new Promise(done=>{
    cancelAnimationFrame(animKamera);
    if(kurangiGerak) durasi=0;
    const m={x:cam.x,y:cam.y,s:cam.s}, awal=performance.now();
    function langkah(kini){
      let t = durasi ? Math.min((kini-awal)/durasi,1) : 1;
      const e = t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
      cam.x=m.x+(tx-m.x)*e; cam.y=m.y+(ty-m.y)*e; cam.s=m.s+(ts-m.s)*e;
      render();
      t<1 ? animKamera=requestAnimationFrame(langkah) : done();
    }
    animKamera=requestAnimationFrame(langkah);
  });
}

/* ============================================================
   📖 PERHENTIAN CERITA (mengikuti storyboard)
   ============================================================ */
const CERITA = [
  { x:500, y:230,  s:()=>sMin*1.7,  judul:"Bismillahirrahmanirrahim",
    isi:"cahaya bahagia itu hadir dari balik awan" },
  { x:500, y:1010, s:()=>sMin*1.25, judul:"Gerbang kebahagiaan",
    isi:"perlahan terbuka untuk kisah kami" },
  { x:500, y:560,  s:()=>sMin*1.8,  judul:"Negeri di atas awan",
    isi:"istana megah, saksikan air terjun yang mengalir" },
  { x:294, y:1105, s:()=>sMin*3.1,  judul:"Sentuhan Tanah Daeng",
    isi:"marmer Olympus berpadu motif Makassar" },
  { x:300, y:1140, s:()=>sMin*2.2,  judul:"Mempelai Pria",
    isi:"" },
  { x:730, y:1140, s:()=>sMin*2.2,  judul:"Mempelai Wanita",
    isi:"" },
  { x:502, y:1180, s:()=>sMin*2.0,  judul:"Dua hati saling berhadapan",
    isi:"seikat bunga, sebuah janji suci", hati:true },
  { x:215, y:1465, s:()=>sMin*2.5,  judul:"The Wedding Of",
    isi:`${C.pria.lengkap} & ${C.wanita.lengkap}` },
  { x:782, y:1465, s:()=>sMin*2.5,  judul:"Rangkaian Acara",
    isi:C.acara.hari },
  { x:172, y:742,  s:()=>sMin*2.7,  judul:"Lokasi Acara",
    isi:"kediaman mempelai wanita — Dapoko" },
  { x:826, y:742,  s:()=>sMin*2.7,  judul:"Doa kami",
    isi:C.ayat.sumber },
  { x:176, y:338,  s:()=>sMin*2.7,  judul:"Save The Date",
    isi:C.tanggalTeks },
  { x:500, y:800,  s:()=>sMin,      judul:"Terima kasih 🤍",
    isi:"kehadiran & doa Anda sangat berarti bagi kami", akhir:true }
];
let langkahKini = -1, kameraSibuk = false, mulaiSudah = false;

CERITA.forEach(()=>{
  const r = document.createElement('div');
  r.className='ruas'; r.innerHTML='<i></i>';
  $('progres').appendChild(r);
});
const ruas = [...$('progres').children];
function tandaiProgres(){
  ruas.forEach((r,i)=>{
    r.classList.toggle('lewat', i<langkahKini);
    r.classList.toggle('kini',  i===langkahKini);
  });
}

async function keLangkah(n){
  if(kameraSibuk || n<0 || n>=CERITA.length || n===langkahKini) return;
  kameraSibuk = true;
  const p = CERITA[n];
  langkahKini = n;
  tandaiProgres();
  $('keterangan').classList.remove('tampil');
  $('ketukLanjut').classList.remove('tampil');
  $('panelAkhir').classList.remove('tampil');

  await terbangKe(p.x, p.y, p.s(), 2300);

  $('keterangan').querySelector('.judul').textContent = p.judul;
  $('keterangan').querySelector('.isi').textContent = p.isi;
  $('keterangan').querySelector('.isi').style.display = p.isi ? 'block':'none';
  $('keterangan').classList.add('tampil');

  if(p.akhir) $('panelAkhir').classList.add('tampil');
  else $('ketukLanjut').classList.add('tampil');

  if(p.hati && !kurangiGerak) hujanHati();
  kameraSibuk = false;
}

/* ketuk = lanjut · tepi kiri = mundur */
jendela.addEventListener('click', e=>{
  if(!mulaiSudah || kameraSibuk) return;
  riak(e.clientX, e.clientY);
  const r = jendela.getBoundingClientRect();
  const kiri = (e.clientX - r.left) < r.width*0.22;
  if(kiri && langkahKini>0) keLangkah(langkahKini-1);
  else if(langkahKini < CERITA.length-1) keLangkah(langkahKini+1);
});
addEventListener('keydown', e=>{
  if(!mulaiSudah) return;
  if(e.key==='ArrowRight'||e.key===' ') keLangkah(langkahKini+1);
  if(e.key==='ArrowLeft') keLangkah(langkahKini-1);
});

function riak(x,y){
  const b = document.querySelector('.bingkai').getBoundingClientRect();
  const d = document.createElement('div');
  d.className='riak';
  d.style.left = (x-b.left-7)+'px';
  d.style.top = (y-b.top-7)+'px';
  document.querySelector('.bingkai').appendChild(d);
  setTimeout(()=>d.remove(), 750);
}
function hujanHati(){
  const b = document.querySelector('.bingkai');
  const r = b.getBoundingClientRect();
  const emoji=['🤍','💛','✨','🕊️'];
  for(let i=0;i<8;i++){
    const h=document.createElement('div');
    h.className='hati';
    h.textContent=emoji[Math.floor(Math.random()*emoji.length)];
    h.style.left = acak(r.width*.25, r.width*.75)+'px';
    h.style.top  = acak(r.height*.35, r.height*.6)+'px';
    h.style.animationDelay=(i*.12)+'s';
    b.appendChild(h);
    setTimeout(()=>h.remove(),2400);
  }
}
$('mnUlang').addEventListener('click', e=>{ e.stopPropagation(); langkahKini=-1; keLangkah(0); });

/* ============================================================
   SAMPUL → mulai cerita
   ============================================================ */
const sampul=$('sampul'), musik=$('musik'), btnMusik=$('btnMusik');
if(C.musikUrl) musik.src=C.musikUrl;
ukuran();
cam={x:500,y:760,s:sMin*1.3}; render();

$('btnBuka').addEventListener('click', ()=>{
  sampul.classList.add('terbuka');
  setTimeout(()=> sampul.classList.add('selesai'), 1600);
  $('progres').classList.add('tampil');
  $('chipMundur').classList.add('tampil');
  if(C.musikUrl){
    btnMusik.style.display='flex';
    musik.play().then(()=>btnMusik.classList.add('putar')).catch(()=>{});
  }
  setTimeout(()=>{ mulaiSudah=true; keLangkah(0); }, 700);
});
btnMusik.addEventListener('click', e=>{
  e.stopPropagation();
  if(musik.paused){ musik.play(); btnMusik.classList.add('putar'); }
  else{ musik.pause(); btnMusik.classList.remove('putar'); }
});

/* ============================================================
   HITUNG MUNDUR
   ============================================================ */
function hitungMundur(){
  const s=Math.max(0,Math.floor((C.tanggalAcara-new Date())/1000));
  $('cd-h').textContent=Math.floor(s/86400);
  $('cd-j').textContent=Math.floor(s%86400/3600);
  $('cd-m').textContent=Math.floor(s%3600/60);
  $('cd-d').textContent=s%60;
}
hitungMundur(); setInterval(hitungMundur,1000);

/* ============================================================
   LEMBAR RSVP & AMPLOP
   ============================================================ */
function bukaLembar(id){ $('tirai').classList.add('tampil'); $(id).classList.add('tampil'); }
function tutupLembar(){ $('tirai').classList.remove('tampil'); document.querySelectorAll('.lembar').forEach(l=>l.classList.remove('tampil')); }
$('mnRsvp').addEventListener('click', e=>{ e.stopPropagation(); bukaLembar('lembarRsvp'); });
$('mnAmplop').addEventListener('click', e=>{ e.stopPropagation(); bukaLembar('lembarAmplop'); });
$('tirai').addEventListener('click', tutupLembar);
document.querySelectorAll('[data-tutup]').forEach(b=> b.addEventListener('click', tutupLembar));
document.querySelectorAll('.lembar').forEach(l=> l.addEventListener('click', e=> e.stopPropagation()));

C.rekening.forEach(r=>{
  const d=document.createElement('div');
  d.className='kartu-rek';
  d.innerHTML=`
    <div class="bank">${r.bank}</div>
    <div class="norek">${r.nomor}</div>
    ${r.pemilik ? `<div class="pemilik">${r.pemilik}</div>` : ''}
    <button class="btn-salin" data-no="${r.nomor.replace(/\s/g,'')}">Salin Nomor</button>`;
  $('daftarRek').appendChild(d);
});
$('daftarRek').addEventListener('click', async e=>{
  const b=e.target.closest('.btn-salin'); if(!b) return;
  try{
    await navigator.clipboard.writeText(b.dataset.no);
    b.textContent='✓ Tersalin'; setTimeout(()=>b.textContent='Salin Nomor',2000);
  }catch(_){ b.textContent=b.dataset.no; }
});

let daftar=[{nama:"Keluarga Besar",hadir:"Hadir",
  pesan:"Barakallahu laka wa baraka 'alaika wa jama'a bainakuma fii khair. Selamat menempuh hidup baru! 🤍"}];
try{
  const t=localStorage.getItem('ucapan-'+namaPendek);
  if(t) daftar=JSON.parse(t);
}catch(_){}
function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function gambarUcapan(){
  $('daftarUcapan').innerHTML=daftar.map((u,i)=>`
    <div class="item-ucapan" style="animation-delay:${Math.min(i*.07,.4)}s">
      <span class="siapa">${escapeHtml(u.nama)}</span><span class="tag">${u.hadir}</span>
      <div class="pesan">${escapeHtml(u.pesan)}</div>
    </div>`).join('');
}
gambarUcapan();
$('btnKirim').addEventListener('click', ()=>{
  const nama=$('f-nama').value.trim(), pesan=$('f-pesan').value.trim(), hadir=$('f-hadir').value;
  if(!nama||!pesan){ alert('Mohon isi nama dan ucapan terlebih dahulu 🙏'); return; }
  daftar.unshift({nama,hadir,pesan});
  try{ localStorage.setItem('ucapan-'+namaPendek, JSON.stringify(daftar)); }catch(_){}
  gambarUcapan();
  $('f-nama').value=''; $('f-pesan').value='';
});

/* ============================================================
   ✨ PARTIKEL — kelopak putih-emas & serbuk cahaya
   ============================================================ */
const kanvas=$('kanvasPartikel'), ctx=kanvas.getContext('2d');
let partikel=[];
function ukurKanvas(){ kanvas.width=kanvas.offsetWidth; kanvas.height=kanvas.offsetHeight; }
ukurKanvas(); addEventListener('resize',ukurKanvas);
(function(){
  for(let i=0;i<C.jumlahKunang;i++)
    partikel.push({j:'k',x:acak(0,kanvas.width),y:acak(0,kanvas.height),
      r:acak(1,2.4),a:acak(.2,.85),da:acak(.004,.012)*(Math.random()<.5?-1:1),
      vx:acak(-.16,.16),vy:acak(-.2,.08)});
  for(let i=0;i<C.jumlahKelopak;i++)
    partikel.push({j:'p',x:acak(0,kanvas.width),y:acak(-kanvas.height,0),
      u:acak(6,11),su:acak(0,6.28),ds:acak(.008,.02),
      vy:acak(.3,.75),gy:acak(0,6.28),w:Math.random()<.55?'#f7f1e0':'#e6d3a3'});
})();
function animasi(){
  ctx.clearRect(0,0,kanvas.width,kanvas.height);
  for(const p of partikel){
    if(p.j==='k'){
      p.x+=p.vx;p.y+=p.vy;p.a+=p.da;
      if(p.a>1){p.a=1;p.da*=-1} if(p.a<.1){p.a=.1;p.da*=-1}
      if(p.y<-10)p.y=kanvas.height+10;
      if(p.x<-10)p.x=kanvas.width+10;
      if(p.x>kanvas.width+10)p.x=-10;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0,`rgba(243,223,158,${p.a})`); g.addColorStop(1,'rgba(243,223,158,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,6.28); ctx.fill();
    }else{
      p.y+=p.vy;p.su+=p.ds;p.gy+=.015;
      if(p.y>kanvas.height+16){p.y=-16;p.x=acak(0,kanvas.width);}
      ctx.save();ctx.translate(p.x+Math.sin(p.gy)*20,p.y);ctx.rotate(p.su);
      ctx.fillStyle=p.w;ctx.globalAlpha=.85;
      ctx.beginPath();ctx.ellipse(0,0,p.u,p.u*.5,0,0,6.28);ctx.fill();ctx.restore();
    }
  }
  requestAnimationFrame(animasi);
}
if(!kurangiGerak) animasi();
</script>
